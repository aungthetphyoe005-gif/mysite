<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lynote - YouTube Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8faff;
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: transparent;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
        }

        .logo-icon {
            background: linear-gradient(135deg, #4f46e5, #a855f7);
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
        }

        .menu-icon {
            font-size: 20px;
            color: #4a5568;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #3b82f6;
        }

        h1 span {
            background: linear-gradient(to right, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 15px;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 50px 16px 45px;
            font-size: 15px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: white;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-image: linear-gradient(white, white), linear-gradient(to right, #3b82f6, #a855f7);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .search-box .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
        }

        .search-box .paste-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5568;
            font-size: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }

        .btn:active {
            opacity: 0.9;
        }

        .btn-get {
            background: linear-gradient(to right, #3b82f6, #a855f7);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .btn-transcribe {
            background: linear-gradient(to right, #3b82f6, #a855f7);
            width: auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 13px;
            color: #718096;
            line-height: 1.5;
        }

        .footer-text i {
            margin-left: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">ln</div>
            Lynote
        </div>
        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <div class="container">
        <h1><span>YouTube Video Downloader</span></h1>
        
        <p class="description">
            Instantly search for or paste a link to download any YouTube video. Save your favorites as MP4, MP3, or M4A files—fast, free, and online.
        </p>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Paste a YouTube link or search by keyword">
            <i class="fa-regular fa-copy paste-icon" title="Paste link"></i>
        </div>

        <button class="btn btn-get">Get Video</button>
        <button class="btn btn-transcribe">Transcribe Video</button>

        <p class="footer-text">
            Download responsibly. Ensure you have the right permissions. <i class="fa-regular fa-circle-question"></i>
        </p>
    </div>

    <script>
        const getBtn = document.querySelector('.btn-get');
        const urlInput = document.querySelector('.search-box input');

        getBtn.addEventListener('click', async () => {
            const videoUrl = urlInput.value.trim();

            if (!videoUrl) {
                alert('Please enter a valid YouTube link!');
                return;
            }

            getBtn.innerText = "Processing...";
            getBtn.disabled = true;

            // YouTube Link ထဲကနေ Video ID (postId) ကို ရှာဖွေဖြတ်ယူခြင်း
            let postId = '';
            try {
                if (videoUrl.includes('v=')) {
                    postId = videoUrl.split('v=')[1].split('&')[0];
                } else if (videoUrl.includes('youtu.be/')) {
                    postId = videoUrl.split('youtu.be/')[1].split('?')[0];
                } else {
                    postId = videoUrl; // ID တိုက်ရိုက်ထည့်ခဲ့လျှင်
                }
            } catch (e) {
                postId = videoUrl;
            }

            // သင်ပေးထားသော RapidAPI သတ်မှတ်ချက်များ
            const apiKey = '629f4f2d57mshd6156ebc0152149p1f9225jsnd6f1033cd8a7';
            const apiHost = 'youtube-video-and-shorts-downloader1.p.rapidapi.com';
            
            // API Endpoints URL 
            const url = `https://${apiHost}/youtube/v3/post/details?postId=${encodeURIComponent(postId)}`;
            
            const options = {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-RapidAPI-Key': apiKey,
                    'X-RapidAPI-Host': apiHost
                }
            };

            try {
                const response = await fetch(url, options);
                const result = await response.json();
                console.log(result); // ရလာတဲ့ data တွေကို စစ်ဆေးရန် console ထုတ်ကြည့်ခြင်း
                
                // API မှ ပြန်ပေးသော Data ပုံစံအလိုက် ဒေါင်းလုဒ်လင့်ခ်ကို ရှာဖွေခြင်း
                // ⚠️ မှတ်ချက်။ ။ API response ပုံစံပေါ်မူတည်ပြီး လိုအပ်ပါက ပြန်ပြင်ရနိုင်ပါသည်
                if (result && result.downloadUrl) {
                    window.open(result.downloadUrl, '_blank');
                } else if (result && result.data && result.data.downloadUrl) {
                    window.open(result.data.downloadUrl, '_blank');
                } else {
                    alert('Video details fetched, but direct download link was not found in the API response. Please check console.');
                }
            } catch (error) {
                console.error(error);
                alert('An error occurred while communicating with the API. Please try again.');
            } finally {
                getBtn.innerText = "Get Video";
                getBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
